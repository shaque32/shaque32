<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Shayan Haque</title>
  <desc id="desc">Software, data, and a little bit of game theory. Colorful orbital artwork on a midnight background.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12132d"/><stop offset="1" stop-color="#19122c"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset=".48" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7c3aed" stop-opacity=".3"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#a78bfa" stroke-opacity=".065"/></pattern>
  </defs>
  <style>
    .orbit{transform-origin:965px 177px;animation:rotate 28s linear infinite}
    .spark{animation:pulse 3s ease-in-out infinite}
    @keyframes rotate{to{transform:rotate(360deg)}}
    @keyframes pulse{50%{opacity:.35}}
    @media(prefers-reduced-motion:reduce){.orbit,.spark{animation:none}}
  </style>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="935" cy="170" rx="295" ry="210" fill="url(#glow)"/>
  <rect x="40" y="42" width="145" height="29" rx="14" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".3"/>
  <circle cx="57" cy="56" r="4" fill="#67e8f9" class="spark"/>
  <text x="71" y="61" fill="#c4b5fd" font-family="monospace" font-size="12" letter-spacing="1.4">HELLO, WORLD</text>
  <text x="44" y="165" fill="#f7f3ff" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="700" letter-spacing="-3">Shayan Haque<tspan fill="#f472b6">.</tspan></text>
  <text x="48" y="211" fill="#c4bbd8" font-family="Arial,Helvetica,sans-serif" font-size="23">Software, data, and a little bit of game theory.</text>
  <rect x="48" y="248" width="48" height="4" rx="2" fill="url(#accent)"/>
  <text x="48" y="297" fill="#a7a0c0" font-family="monospace" font-size="14" letter-spacing="2">CS @ JOHNS HOPKINS</text>
  <g fill="none" stroke-width="1.3">
    <circle cx="965" cy="177" r="118" stroke="#a78bfa" stroke-opacity=".24"/>
    <ellipse cx="965" cy="177" rx="158" ry="60" stroke="#67e8f9" stroke-opacity=".45" transform="rotate(-35 965 177)"/>
    <ellipse cx="965" cy="177" rx="158" ry="60" stroke="#f472b6" stroke-opacity=".45" transform="rotate(35 965 177)"/>
    <circle cx="965" cy="177" r="77" stroke="#a78bfa" stroke-opacity=".2" stroke-dasharray="4 9"/>
  </g>
  <g class="orbit"><circle cx="965" cy="59" r="7" fill="#67e8f9"/><circle cx="965" cy="295" r="6" fill="#f472b6"/></g>
  <rect x="918" y="130" width="94" height="94" rx="26" fill="#25203c" stroke="#a78bfa" stroke-opacity=".55" transform="rotate(-8 965 177)"/>
  <text x="965" y="190" text-anchor="middle" fill="url(#accent)" font-family="monospace" font-size="39" font-weight="700">sh.</text>
  <path d="M1080 55v16m-8-8h16M833 286v12m-6-6h12" stroke="#f9a8d4" stroke-width="2" class="spark"/>
  <rect x="24" y="351" width="1152" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
